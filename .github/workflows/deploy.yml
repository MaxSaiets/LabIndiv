name: Deploy to Render

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
        run: |
          # Простий тест імпорту модулів
          python -c "from hashtag_app import create_app; app = create_app(); print('App created successfully')"
          # Можна додати більше тестів тут

      - name: Check code quality
        run: |
          pip install flake8
          flake8 hashtag_app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 hashtag_app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Deployment would be triggered here"
          # Render автоматично деплоїть при push до main, тому цей крок опціональний
          # Якщо потрібен ручний тригер через API:
          # curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
          #   -H "Authorization: Bearer $RENDER_API_KEY"

